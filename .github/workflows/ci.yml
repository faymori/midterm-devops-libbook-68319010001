name: CI/CD Pipeline

on:
  push:
    branches: [ develop, main, "feature/*" ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: libbook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18
        cache: 'npm'
        cache-dependency-path: backend/package.json

    - name: Install dependencies
      run: |
        cd backend
        npm install

    - name: Run ESLint (Code Quality Scan)
      run: |
        cd backend
        npm run lint

    - name: Initialize Test Database Structure
      run: |
        PGPASSWORD=password psql -h localhost -U postgres -d libbook_test -f init.sql

    - name: Run Unit Tests (Jest & Supertest)
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/libbook_test
        NODE_ENV: test
        PORT: 5001
      run: |
        cd backend
        npm test

    # ========================================================
    # CD PART: บิลด์และอัปโหลดอิมเมจขึ้น Docker Hub อัตโนมัติ (เฉพาะ Branch main)
    # ========================================================
    - name: Log in to Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Backend Image
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/midterm-backend:latest
          ${{ secrets.DOCKER_USERNAME }}/midterm-backend:${{ github.sha }}

    - name: Build and Push Frontend Image
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/midterm-frontend:latest
          ${{ secrets.DOCKER_USERNAME }}/midterm-frontend:${{ github.sha }}