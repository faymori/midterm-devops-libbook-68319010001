name: CI Pipeline

on:
  push:
    branches: [ develop, main, feature/* ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: libbook_test
        ports:
          - 5432:5432
        # รอให้ Postgres พร้อมใช้งานก่อนเริ่มรันงาน
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18
        cache: 'npm'
        cache-dependency-path: backend/package.json

    - name: Install dependencies
      run: |
        cd backend
        npm install

    - name: Run ESLint (Code Quality Scan)
      run: |
        cd backend
        npm run lint

    - name: Initialize Test Database Structure
      run: |
        PGPASSWORD=password psql -h localhost -U postgres -d libbook_test -f init.sql

    - name: Run Unit Tests (Jest & Supertest)
      env:
        DATABASE_URL: postgresql://postgres:password@localhost:5432/libbook_test
        NODE_ENV: test
        PORT: 5001
      run: |
        cd backend
        npm test